[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-framework"
version = "0.1.0"
description = "TRACE: a claim-level reliability framework for document-grounded LLM outputs."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Sebastian Andrades" }
]
keywords = ["llm", "reliability", "evaluation", "traceability", "research"]
dependencies = [
    "streamlit",
    "pypdf"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
